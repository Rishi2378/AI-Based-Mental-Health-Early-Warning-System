services:
  - type: web
    name: mindguard-ai
    env: python
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .. && python backend/ml/generate_datasets.py && python backend/ml/train_text_model.py && python backend/ml/train_voice_model.py"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
