version: '3.8'

services:
  mindguard-ai:
    build: .
    container_name: mindguard-ai-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=mindguard-ai-secret-production-key-2026
      - DATABASE_URL=sqlite:////app/backend/database/mindguard.db
    volumes:
      - mindguard-data:/app/backend/database
    restart: unless-stopped

volumes:
  mindguard-data:
